# Supabase CLI project config. `project_id` is a local label only.
project_id = "ccentrik-recruitment"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

# Candidates always use Google. Talent Acquisition can use Google or a
# password (their account is provisioned by an admin via the dashboard —
# Authentication -> Users -> Add user -> set a password; self-service sign-up
# stays off so a random email/password can't create an account).
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"

[auth.email]
enable_signup = false
enable_confirmations = false
